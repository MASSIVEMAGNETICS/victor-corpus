[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "victor-corpus"
version = "1.0.0"
description = "Victor Corpus — The Hybrid Super-Monolithic Sovereign Entity"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typing-extensions",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["victor_corpus*", "organ_connector*"]
